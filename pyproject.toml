[project]
name = "voluntaco-api"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (orden de imports)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # longitud de línea (ya controlada por line-length, pero con tolerancia)
    "B008",  # Depends()/Query() en valores por defecto es el patrón idiomático de FastAPI
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
